[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epiresist"
version = "0.1.0"
description = "Multimodal physics-constrained architecture embedding coupled ODE systems for HMA drug-resistance prediction and mechanism discovery in AML"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchdiffeq>=0.2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "msgspec>=0.18",
    "pyyaml>=6.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3", "black>=24.0", "isort>=5.12", "mypy>=1.8"]

[project.scripts]
epiresist = "epiresist.counter.__main__:app"

[tool.setuptools.packages.find]
include = ["epiresist*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["epiresist"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["epiresist"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
disallow_untyped_calls = false
disallow_any_generics = false
ignore_missing_imports = true
files = ["epiresist"]
